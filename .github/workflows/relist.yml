name: eBay Listing Refresh

on:
  schedule:
    # Weekdays (Mon-Fri) at 13:00 UTC (07:00 America/Denver during MDT /
    # 06:00 during MST). Combined with REFRESH_CAP_PER_RUN=1 in config.py,
    # this is a steady ~1/weekday trickle - about 5/week, ~22/month -
    # deliberately well short of anything that reads as a bulk listing
    # churn. Adjust to taste - GitHub Actions cron is always UTC.
    - cron: '0 13 * * 1-5'
  workflow_dispatch: {}  # manual "Run workflow" button for testing

jobs:
  refresh-listings:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the updated data/listings.json back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run relist sweep
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_ENV: ${{ secrets.EBAY_ENV }}
        # Live as of 2026-10-25 - secrets added, manual live run confirmed
        # working against Production (see README). This now actually ends
        # and relists real listings.
        run: python -m src.relist_worker --write

      - name: Commit updated listings database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          git diff --staged --quiet || git commit -m "Relist sweep $(date -u +%Y-%m-%d)"
          git push
